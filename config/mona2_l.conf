#Encoder config -------------------
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=300

#Sleep config -------------------
# Peripheral side sleep is disabled: key matrix GPIOs on this shield
# are not configured as wake sources, so the board cannot wake from
# deep sleep without a physical power cycle.
CONFIG_ZMK_SLEEP=n